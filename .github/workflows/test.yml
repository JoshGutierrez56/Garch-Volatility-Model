name: test
on:
  push:
  pull_request:
jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python run_garch.py --offline --start 2020-01-01 --end 2024-01-01 --evaluation-step 63
